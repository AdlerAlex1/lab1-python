[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
description = "Консольный набор утилит"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]